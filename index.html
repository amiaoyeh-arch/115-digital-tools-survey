<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>學習共同體輔導團｜「數位工具教與學」到校輔導前置調查</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 頂部導覽列 (純教師填答視圖) -->
  <header class="navbar">
    <div class="nav-container">
      <div class="logo-area">
        <div class="logo-icon">🌿</div>
        <div class="logo-text">
          <h1>學共輔導團・數位工具教與學</h1>
          <p>2小時到校輔導前置問卷調查系統</p>
        </div>
      </div>
      <div class="nav-actions">
        <span style="font-size: 0.9rem; font-weight: 600; color: var(--primary-color); display: flex; align-items: center; gap: 6px;">
          <span>✍️</span> 教師問卷填答
        </span>
      </div>
    </div>
  </header>

  <main class="main-wrapper">

    <!-- ==========================================
         教師問卷填答介面 (Survey View)
         ========================================== -->
    <div id="survey-view">
      <!-- 橫幅介紹區 -->
      <section class="hero-banner">
        <div class="hero-badge">2小時入校輔導研習・精準對接現場</div>
        <h2 class="hero-title">「數位工具教與學」教師使用情形調查</h2>
        <p class="hero-desc">
          老師您好！學習共同體輔導團即將來到貴校進行 2 小時的「數位工具教與學」入校輔導。為了讓研習內容緊密貼合大家的日常教學節奏、硬體設備與實際痛點，請花費約 3 分鐘填寫本問卷。您的回饋將直接決定當天工作坊的實作模組配比！
        </p>
      </section>

      <!-- 進度指示條 -->
      <section class="progress-card">
        <div class="progress-header">
          <span class="progress-step-text" id="progress-step-text">步驟 1 / 4：基本背景資料</span>
          <span class="progress-pct" id="progress-pct">25% 完成</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="step-indicators">
          <div class="step-node active" data-step="1">
            <div class="step-dot"></div>
            <span>1. 背景資料</span>
          </div>
          <div class="step-node" data-step="2">
            <div class="step-dot"></div>
            <span>2. 工具環境</span>
          </div>
          <div class="step-node" data-step="3">
            <div class="step-dot"></div>
            <span>3. 學共卡點</span>
          </div>
          <div class="step-node" data-step="4">
            <div class="step-dot"></div>
            <span>4. 研習期待</span>
          </div>
        </div>
      </section>

      <!-- 問卷動態卡片主體 -->
      <section class="survey-card">
        <div id="survey-content-area">
          <!-- 題目將由 survey-app.js 動態注入 -->
        </div>

        <!-- 底部切換按鈕 -->
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="btn-prev" style="display: none;">
            <span>←</span> 上一步
          </button>
          <div style="flex: 1;"></div>
          <button type="button" class="btn btn-primary" id="btn-next">
            下一步 <span>→</span>
          </button>
          <button type="button" class="btn btn-success" id="btn-submit" style="display: none;">
            <span>✓</span> 送出問卷調查
          </button>
        </div>
      </section>
    </div>

  </main>

  <!-- 全域提示訊息浮層 (Toast) -->
  <div id="toast" class="toast-msg"></div>

  <!-- 應用程式腳本 -->
  <script src="js/survey-data.js"></script>
  <script src="js/survey-app.js"></script>

</body>
</html>
